# Publica el frontend (carpeta frontend/) en GitHub Pages cada vez que haces push a main.
# Configura en GitHub: Settings > Pages > Source: "GitHub Actions"
# y en Settings > Secrets and variables > Actions > Variables:
#   PUBLIC_API_URL           = https://api.guiadeparche.com/recordatorio
#   PUBLIC_GOOGLE_CLIENT_ID  = tu-id.apps.googleusercontent.com
name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
